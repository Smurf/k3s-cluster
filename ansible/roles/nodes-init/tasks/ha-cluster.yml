- name: Init tls_san value
  ansible.builtin.set_fact:
    tls_san: ""

- name: Construct tls-san value for external load balancer
  ansible.builtin.set_fact:
    tls_san: "{{ tls_san }} --tls-san={{ lb_ip }}"
  when:
    - lb_enabled is defined

- name: Construct tls-san value for vip ip
  ansible.builtin.set_fact:
    tls_san: ""
    tls_san: "{{ tls_san }} --tls-san={{ vip_ip }}"
  when:
    - vip_enabled is defined

- name: Initialize first node in the cluster
  ansible.builtin.shell:
    cmd: |
      curl -sfL https://get.k3s.io | K3S_TOKEN={{ k3s_token }} sh -s - server \
      --cluster-init \
      --disable=servicelb \
      {{ tls_san }}
  when: 
    - node_role == "master"

- name: Initialize server node
  ansible.builtin.shell:
    cmd: |
      curl -sfL https://get.k3s.io | K3S_TOKEN={{ k3s_token }} sh -s - server \
      --server https://{{ vip_ip }}:6443 \
      --disable=servicelb \
      {{ tls_san }}
  when: 
    - node_role == "server"
  ignore_errors: yes

- name: Initialize agent node
  ansible.builtin.shell:
    cmd: |
      curl -sfL https://get.k3s.io | K3S_TOKEN={{ k3s_token }} sh -s - agent \
      --server https://{{ vip_ip }}:6443 \
      --disable=servicelb \
      {{ tls_san }}
  when:
    - node_role == "agent"
